<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520"><rect width="900" height="520" fill="white"/><text x="40" y="42" font-family="Arial" font-size="26" font-weight="bold">Wheel frame and contact directions</text><text x="40" y="70" font-family="Arial" font-size="16">Project notation: d = drive/traction, a = axial/perpendicular.</text><circle cx="430" cy="275" r="155" fill="none" stroke="#222" stroke-width="3"/><circle cx="430" cy="275" r="5"/><line x1="430" y1="275" x2="585" y2="275" stroke="#555" stroke-width="3"/><polygon points="600,275 580,267 580,283" fill="#555"/><text x="610" y="281" font-family="Arial" font-size="18">X_M</text><line x1="430" y1="275" x2="430" y2="120" stroke="#555" stroke-width="3"/><polygon points="430,105 422,125 438,125" fill="#555"/><text x="440" y="115" font-family="Arial" font-size="18">Y_M</text><line x1="430" y1="275" x2="555" y2="155" stroke="#222" stroke-width="3"/><text x="510" y="150" font-family="Arial" font-size="18">p_i</text><circle cx="555" cy="155" r="5"/><rect x="539" y="115" width="32" height="80" fill="#ddd" stroke="#222" stroke-width="2" transform="rotate(46 555 155)"/><line x1="555" y1="155" x2="630" y2="80" stroke="#1976d2" stroke-width="4"/><polygon points="638,72 618,80 630,90" fill="#1976d2"/><text x="648" y="80" font-family="Arial" font-size="20" fill="#1976d2">d_hat_i</text><line x1="555" y1="155" x2="630" y2="198" stroke="#c62828" stroke-width="4"/><polygon points="640,203 620,190 623,207" fill="#c62828"/><text x="650" y="210" font-family="Arial" font-size="20" fill="#c62828">a_hat_i</text><line x1="100" y1="430" x2="185" y2="430" stroke="#555" stroke-width="3"/><polygon points="200,430 180,422 180,438" fill="#555"/><text x="210" y="436" font-family="Arial" font-size="18">X_0</text><line x1="100" y1="430" x2="100" y2="345" stroke="#555" stroke-width="3"/><polygon points="100,330 92,350 108,350" fill="#555"/><text x="110" y="350" font-family="Arial" font-size="18">Y_0</text><text x="40" y="490" font-family="Arial" font-size="15">a_hat_i is radial/axial; d_hat_i is tangential/drive.</text></svg>