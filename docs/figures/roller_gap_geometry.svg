<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560"><rect width="900" height="560" fill="white"/><text x="40" y="42" font-family="Arial" font-size="26" font-weight="bold">Roller / rigid-gap contact geometry</text><text x="40" y="70" font-family="Arial" font-size="16">Original redraw based on the geometry described by Williams et al.</text><circle cx="420" cy="285" r="170" fill="none" stroke="#222" stroke-width="3"/><circle cx="420" cy="285" r="5"/><text x="435" y="279" font-family="Arial" font-size="17">wheel centre</text><g fill="#ccc" stroke="#222" stroke-width="2"><rect x="407" y="112" width="26" height="55" rx="11"/><rect x="536" y="151" width="26" height="55" rx="11" transform="rotate(45 549 178)"/><rect x="592" y="272" width="26" height="55" rx="11" transform="rotate(90 605 299)"/><rect x="505" y="405" width="26" height="55" rx="11" transform="rotate(135 518 432)"/><rect x="342" y="405" width="26" height="55" rx="11" transform="rotate(-135 355 432)"/><rect x="221" y="272" width="26" height="55" rx="11" transform="rotate(-90 234 299)"/><rect x="278" y="151" width="26" height="55" rx="11" transform="rotate(-45 291 178)"/></g><circle cx="420" cy="115" r="6"/><text x="433" y="108" font-family="Arial" font-size="18">contact point</text><line x1="420" y1="285" x2="420" y2="115" stroke="#777" stroke-width="2" stroke-dasharray="7 6"/><text x="435" y="205" font-family="Arial" font-size="18">rho_i</text><line x1="420" y1="115" x2="510" y2="115" stroke="#1976d2" stroke-width="4"/><polygon points="523,115 505,107 505,123" fill="#1976d2"/><text x="535" y="121" font-family="Arial" font-size="19" fill="#1976d2">d_hat_i</text><line x1="420" y1="115" x2="420" y2="42" stroke="#c62828" stroke-width="4"/><polygon points="420,30 412,48 428,48" fill="#c62828"/><text x="435" y="44" font-family="Arial" font-size="19" fill="#c62828">a_hat_i</text><path d="M420 190 A95 95 0 0 1 470 205" fill="none" stroke="#555" stroke-width="2"/><text x="475" y="205" font-family="Arial" font-size="17">pitch = 2*pi/N_r</text><text x="55" y="485" font-family="Arial" font-size="19">v_W,i = v_c,i dot d_hat_i + rho_i theta_dot_i</text><text x="55" y="520" font-family="Arial" font-size="19">v_T,i = v_c,i dot a_hat_i</text></svg>